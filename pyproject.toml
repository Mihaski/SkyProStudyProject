[project]
name = "skyprostudyproject"
version = "0.1.0"
description = ""
authors = [
    { name = "Mikey Zabrodin", email = "mzabrodin94@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "python-dotenv (>=1.2.2,<2.0.0)",
    "requests (>=2.34.2,<3.0.0)"
]

[tool.poetry]
name = "skyprostudyproject"
version = "0.1.0"
description = "Project for processing financial transactions with currency conversion"
authors = ["Mikey Zabrodin <mzabrodin94@gmail.com>"]
readme = "README.md"
packages = [
    { include = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "mypy (>=2.1.0,<3.0.0)"
]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)"
]

[tool.mypy]
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
warn_unreachable = true

[tool.black]
# Максимальная длина строки
line-length = 119
# Файлы, которые не нужно форматировать
exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | dist
  )/
)
'''

[tool.isort]
# максимальная длина строки
line_length = 119
